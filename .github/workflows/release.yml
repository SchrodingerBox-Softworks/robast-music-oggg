name: Build & Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  APP_NAME: schrodinger-audio-converter

jobs:

  # ============================================================
  # WINDOWS
  # ============================================================

  build-windows:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      # Static ffmpeg.exe is downloaded and embedded by build.rs
      # so the shipped Windows binary is a single self-contained .exe.

      - name: Build
        run: cargo build --release --locked --features bundle-ffmpeg

      - name: Test
        run: cargo test --release --locked

      - name: Package
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          New-Item -ItemType Directory -Force -Path "release"

          Copy-Item `
            "target/release/${env:APP_NAME}.exe" `
            "release/${env:APP_NAME}-windows-x64.exe"

          if (Test-Path "LICENSE") {
            Copy-Item "LICENSE" "release/LICENSE"
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: release/${{ env.APP_NAME }}-windows-x64.exe


  # ============================================================
  # LINUX
  # ============================================================

  build-linux:
    name: Linux x64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libx11-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libegl1-mesa-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: x86_64-unknown-linux-gnu

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      # --------------------------------------------------------
      # Download FFmpeg
      # --------------------------------------------------------

      - name: Download FFmpeg
        shell: bash
        run: |
          mkdir -p assets/ffmpeg/linux

          wget -O ffmpeg.tar.xz \
            https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz

          mkdir -p ffmpeg-temp

          tar -xf ffmpeg.tar.xz -C ffmpeg-temp

          FFMPEG_PATH=$(find ffmpeg-temp -type f -name ffmpeg | head -n 1)

          if [ -z "$FFMPEG_PATH" ]; then
            echo "ffmpeg binary not found"
            exit 1
          fi

          cp "$FFMPEG_PATH" assets/ffmpeg/linux/ffmpeg

          chmod +x assets/ffmpeg/linux/ffmpeg

          echo "FFmpeg installed:"
          ls -lh assets/ffmpeg/linux/ffmpeg

          rm -rf ffmpeg-temp ffmpeg.tar.xz

      # --------------------------------------------------------
      # Build
      # --------------------------------------------------------

      - name: Build
        run: cargo build --release --locked --features bundle-ffmpeg

      - name: Test
        run: cargo test --release --locked

      # --------------------------------------------------------
      # Package
      # --------------------------------------------------------

      - name: Package
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"

          mkdir -p release

          cp \
            "target/release/${APP_NAME}" \
            "release/${APP_NAME}-linux-x64"

          if [ -f LICENSE ]; then
            cp LICENSE release/LICENSE
          fi

          chmod +x "release/${APP_NAME}-linux-x64"

          cd release

          tar -czf \
            "../${APP_NAME}-${TAG}-linux-x64.tar.gz" \
            *

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: ${{ env.APP_NAME }}-${{ github.ref_name }}-linux-x64.tar.gz


  # ============================================================
  # RELEASE
  # ============================================================

  release:
    name: Create GitHub Release
    needs:
      - build-windows
      - build-linux

    runs-on: ubuntu-latest

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: release

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-x64
          path: release

      - name: Generate checksums
        working-directory: release
        run: |
          sha256sum * > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
