[package]
name = "schrodinger-audio-converter"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.35", default-features = false, features = [
    "default_fonts",
    "glow",
    "persistence"
] }

egui_extras = "0.35"

image = { version = "0.25", default-features = false, features = ["png"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

rfd = "0.15"

walkdir = "2"

rayon = "1"

[build-dependencies]
winresource = "0.1"
