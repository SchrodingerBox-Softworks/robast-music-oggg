[package]
name = "schrodinger-audio-converter"
version = "0.1.0"
edition = "2021"

[features]
default = []
bundle-ffmpeg = []

[dependencies]
eframe = "0.29"
egui = "0.29"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = true
strip = true

[build-dependencies]
winresource = "0.1"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
